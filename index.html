<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Twitch Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        
        p {
            font-size: 16px;
            opacity: 0.9;
            margin: 10px 0;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(220, 38, 38, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎮</div>
        <h1 id="title">Authenticating...</h1>
        <p id="message">
            <span class="loading"></span>
            <br><br>
            Processing your Twitch authentication
        </p>
        <div id="details"></div>
    </div>

    <script>
        // Extract token from URL fragment (OAuth implicit flow)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        
        const accessToken = params.get('access_token');
        const tokenType = params.get('token_type');
        const expiresIn = params.get('expires_in');
        const scope = params.get('scope');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');
        
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const detailsEl = document.getElementById('details');
        
        if (error) {
            // Handle OAuth error
            titleEl.textContent = 'Authentication Failed';
            messageEl.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${error}<br>
                    ${errorDescription || 'Unknown error occurred'}
                </div>
                <p style="margin-top: 20px;">Please close this window and try again.</p>
            `;
        } else if (accessToken) {
            // Success! Token received
            titleEl.textContent = 'Authentication Successful!';
            messageEl.innerHTML = `
                <div class="success">
                    ✅ Successfully authenticated with Twitch<br>
                    Token expires in ${expiresIn} seconds
                </div>
                <p style="margin-top: 20px;">You can close this window now.</p>
            `;
            
            // Log details for debugging (remove in production)
            console.log('🎉 Authentication successful!');
            console.log('Access Token:', accessToken);
            console.log('Token Type:', tokenType);
            console.log('Expires In:', expiresIn);
            console.log('Scopes:', scope);
            
            // Attempt to close the window after a short delay
            setTimeout(() => {
                window.close();
            }, 2000);
            
            // If window.close() doesn't work (browser security), show a message
            setTimeout(() => {
                if (!document.hidden) {
                    messageEl.innerHTML += `
                        <p style="margin-top: 20px; opacity: 0.8;">
                            <small>If this window doesn't close automatically, please close it manually.</small>
                        </p>
                    `;
                }
            }, 3000);
        } else {
            // No token and no error - something went wrong
            titleEl.textContent = 'Unexpected Response';
            messageEl.innerHTML = `
                <div class="error">
                    No access token received from Twitch.<br>
                    This might be a configuration issue.
                </div>
                <p style="margin-top: 20px;">Please check your app settings and try again.</p>
            `;
            
            detailsEl.innerHTML = `
                <details style="margin-top: 20px; text-align: left;">
                    <summary style="cursor: pointer;">Debug Information</summary>
                    <pre style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; overflow-x: auto; margin-top: 10px;">
URL Hash: ${hash || '(empty)'}
                    </pre>
                </details>
            `;
        }
    </script>
</body>
</html>
