<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chatty Auth</title>
</head>
<body>

    <script>
        // Immediately check if we have a token
        const hash = window.location.hash;
        
        if (hash && hash.includes('access_token')) {
            // Token found! Log it for debugging
            console.log('✅ Token found in URL');
            console.log('📍 Full URL:', window.location.href);
            
            // ASWebAuthenticationSession will capture this URL automatically
            // We don't need to do anything else
            document.body.innerHTML = `<h1 style="color: green;">✅ Success! Returning to app...</h1><br/><h1>URL: ${window.location.href}</h1>`;
        } else if (hash && hash.includes('error')) {
            // Error from OAuth
            const params = new URLSearchParams(hash.substring(1));
            const error = params.get('error');
            console.error('❌ OAuth error:', error);
            document.body.innerHTML = '<h1 style="color: red;">❌ Error: ' + error + '</h1>';
        } else {
            // No hash - probably the success redirect
            console.log('📍 No hash in URL');
            document.body.innerHTML = '<h1>Redirecting...</h1>';
        }

        
    </script>
</body>
</html>
