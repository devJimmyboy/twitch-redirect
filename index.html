<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty - Twitch Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .success {
            background: rgba(34, 197, 94, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .error {
            background: rgba(220, 38, 38, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 64px; margin-bottom: 20px;">🎮</div>
        <h1 id="title">Authenticating...</h1>
        <p id="message">Processing your Twitch authentication</p>
    </div>

    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        
        const accessToken = params.get('access_token');
        const expiresIn = params.get('expires_in');
        const error = params.get('error');
        const errorDescription = params.get('error_description');
        
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        
        if (error) {
            titleEl.textContent = 'Authentication Failed';
            messageEl.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${error}<br>
                    ${errorDescription || 'Unknown error'}
                </div>
                <p style="margin-top: 20px;">Please close this window and try again.</p>
            `;
        } else if (accessToken) {
            titleEl.textContent = 'Authentication Successful!';
            messageEl.innerHTML = `
                <div class="success">
                    ✅ Successfully authenticated with Twitch<br>
                    Token expires in ${expiresIn} seconds
                </div>
                <p style="margin-top: 20px;">Returning to app...</p>
            `;
            
            console.log('✅ Authentication successful!');
            console.log('Token received (first 20 chars):', accessToken.substring(0, 20) + '...');
            
            // Don't auto-close - let ASWebAuthenticationSession handle it
            setTimeout(() => {
                messageEl.innerHTML += `
                    <p style="margin-top: 20px; opacity: 0.8;">
                        <small>The app should open automatically.<br>If not, close this window.</small>
                    </p>
                `;
            }, 3000);
        } else {
            titleEl.textContent = 'Unexpected Response';
            messageEl.innerHTML = `
                <div class="error">
                    No access token received.<br>
                    Please check your app configuration.
                </div>
            `;
        }
    </script>
</body>
</html>
